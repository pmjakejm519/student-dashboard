<title>Student Tech Help Desk</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: a service-counter app. Sticky top bar with tabs, one centered working column for students, a two-pane queue for the IT desk. */
:root {
  --bg: #f3f5f8;
  --surface: #ffffff;
  --sunk: #e8ecf2;
  --line: #d3d9e3;
  --fg: #172033;
  --muted: #5a6478;
  --accent: #1f4fd1;
  --accent-ink: #ffffff;
  --accent-soft: #e3eafc;
  --ok: #17794a; --ok-soft: #dff3e8;
  --warn: #9a5b00; --warn-soft: #fbedd5;
  --bad: #b42335; --bad-soft: #fbe2e5;
  --info: #5b3cc4; --info-soft: #ece6fb;
  --font-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --font-body: "IBM Plex Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --radius: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f141d; --surface: #171e2a; --sunk: #1f2837; --line: #2c3749;
    --fg: #e6eaf2; --muted: #9aa5b8; --accent: #7c9cff; --accent-ink: #0b1020; --accent-soft: #1d2a4d;
    --ok: #5fd39a; --ok-soft: #143426; --warn: #f0b45a; --warn-soft: #3a2c13;
    --bad: #ff8a98; --bad-soft: #3d1820; --info: #b9a5ff; --info-soft: #2a2148;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f141d; --surface: #171e2a; --sunk: #1f2837; --line: #2c3749;
  --fg: #e6eaf2; --muted: #9aa5b8; --accent: #7c9cff; --accent-ink: #0b1020; --accent-soft: #1d2a4d;
  --ok: #5fd39a; --ok-soft: #143426; --warn: #f0b45a; --warn-soft: #3a2c13;
  --bad: #ff8a98; --bad-soft: #3d1820; --info: #b9a5ff; --info-soft: #2a2148;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 15px; line-height: 1.5; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
h1, h2, h3 { font-family: var(--font-display); text-wrap: balance; margin: 0; line-height: 1.2; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line); }
.bar-in { max-width: 1180px; margin: 0 auto; padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; flex-wrap: wrap; align-items: center; gap: 10px 20px; }
.brand { display: flex; align-items: center; gap: 10px; font-family: var(--font-display); font-weight: 700; font-size: 18px; margin-right: auto; }
.brand svg { flex: none; }
.tabs { display: flex; gap: 4px; flex-wrap: wrap; }
.tab { border: 0; background: transparent; padding: 7px 12px; border-radius: 8px; cursor: pointer; color: var(--muted); font-weight: 500; display: inline-flex; gap: 6px; align-items: center; }
.tab:hover { background: var(--sunk); color: var(--fg); }
.tab[aria-selected="true"] { background: var(--accent-soft); color: var(--accent); }
.count { font-family: var(--font-mono); font-size: 12px; background: var(--accent); color: var(--accent-ink); border-radius: 99px; padding: 0 7px; }

main { max-width: 1180px; margin: 0 auto; padding-block: 28px 60px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.col { max-width: 680px; margin: 0 auto; display: grid; gap: 20px; }
.lede h1 { font-size: clamp(26px, 4vw, 34px); }
.lede p { color: var(--muted); margin: 6px 0 0; max-width: 60ch; }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 22px; display: grid; gap: 18px; }
.stepper { display: flex; gap: 6px; align-items: center; font-size: 13px; color: var(--muted); flex-wrap: wrap; }
.stepper span { display: inline-flex; align-items: center; gap: 6px; }
.stepper b { width: 22px; height: 22px; border-radius: 50%; display: inline-grid; place-items: center; background: var(--sunk); font-family: var(--font-mono); font-size: 12px; font-weight: 500; }
.stepper .on { color: var(--fg); font-weight: 600; }
.stepper .on b { background: var(--accent); color: var(--accent-ink); }
.stepper .done b { background: var(--ok-soft); color: var(--ok); }
.stepper i { width: 18px; height: 1px; background: var(--line); }

.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px; }
label.f { display: grid; gap: 5px; font-weight: 500; font-size: 14px; }
label.f small { color: var(--muted); font-weight: 400; }
input[type=text], input[type=email], input[type=tel], select, textarea {
  width: 100%; border: 1px solid var(--line); background: var(--bg); border-radius: 8px; padding: 9px 11px;
}
textarea { min-height: 96px; resize: vertical; }
input:focus, select:focus, textarea:focus { outline: 2px solid var(--accent); outline-offset: 0; border-color: transparent; }
.err { color: var(--bad); font-size: 13px; }

.choices { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
.choice { border: 1px solid var(--line); background: var(--bg); border-radius: 8px; padding: 10px 12px; text-align: left; cursor: pointer; display: grid; gap: 2px; }
.choice:hover { border-color: var(--accent); }
.choice[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); box-shadow: inset 0 0 0 1px var(--accent); }
.choice strong { font-weight: 600; font-size: 14px; }
.choice span { color: var(--muted); font-size: 12.5px; }
.issues { grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); }

.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.row.end { justify-content: flex-end; }
.btn { border: 1px solid var(--line); background: var(--surface); padding: 9px 16px; border-radius: 8px; cursor: pointer; font-weight: 500; }
.btn:hover { background: var(--sunk); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.good { background: var(--ok-soft); color: var(--ok); border-color: transparent; }
.btn.small { padding: 4px 10px; font-size: 13px; }
.btn[disabled] { opacity: .55; cursor: not-allowed; }
.link { background: none; border: 0; color: var(--accent); cursor: pointer; padding: 0; text-decoration: underline; text-underline-offset: 2px; }

.guide-head { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; align-items: baseline; }
.guide-head .of { font-family: var(--font-mono); font-size: 13px; color: var(--muted); }
.progress { height: 6px; background: var(--sunk); border-radius: 99px; overflow: hidden; }
.progress div { height: 100%; background: var(--accent); transition: width .25s; }
.stepcard { border-left: 3px solid var(--accent); padding: 4px 0 4px 16px; display: grid; gap: 8px; }
.stepcard h3 { font-size: 20px; }
.stepcard p { margin: 0; max-width: 62ch; }
.stepcard ol { margin: 0; padding-left: 20px; display: grid; gap: 4px; }
.tip { background: var(--sunk); border-radius: 8px; padding: 10px 12px; font-size: 14px; color: var(--muted); }

.notice { border-radius: var(--radius); padding: 14px 16px; display: grid; gap: 6px; }
.notice.ok { background: var(--ok-soft); color: var(--fg); }
.notice.ok h3 { color: var(--ok); }
.notice.warn { background: var(--warn-soft); }
.tid { font-family: var(--font-mono); font-weight: 500; letter-spacing: .02em; }
pre.summary { white-space: pre-wrap; background: var(--sunk); padding: 12px; border-radius: 8px; font-family: var(--font-mono); font-size: 12.5px; margin: 0; overflow-x: auto; }

.pill { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 600; padding: 2px 9px; border-radius: 99px; white-space: nowrap; }
.pill::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.s-new { background: var(--bad-soft); color: var(--bad); }
.s-progress { background: var(--accent-soft); color: var(--accent); }
.s-waiting { background: var(--warn-soft); color: var(--warn); }
.s-resolved { background: var(--ok-soft); color: var(--ok); }
.s-self { background: var(--info-soft); color: var(--info); }
.urgent { font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--bad); }

.mylist { display: grid; gap: 12px; }
.tcard { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px 18px; display: grid; gap: 10px; }
.tcard-h { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; }
.tcard-h h3 { font-size: 17px; margin-right: auto; }
.meta { color: var(--muted); font-size: 13px; }

.thread { display: grid; gap: 8px; }
.msg { padding: 9px 12px; border-radius: 10px; max-width: 85%; display: grid; gap: 2px; }
.msg p { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; }
.msg small { color: var(--muted); font-size: 11.5px; }
.msg.me { background: var(--accent-soft); justify-self: end; }
.msg.them { background: var(--sunk); justify-self: start; }
.reply { display: flex; gap: 8px; align-items: flex-end; }
.reply textarea { min-height: 42px; height: 42px; }

/* Desk */
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; margin-bottom: 18px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; cursor: pointer; text-align: left; display: grid; gap: 2px; }
.stat:hover { border-color: var(--accent); }
.stat[aria-pressed="true"] { box-shadow: inset 0 0 0 2px var(--accent); border-color: var(--accent); }
.stat b { font-family: var(--font-display); font-size: 28px; font-variant-numeric: tabular-nums; line-height: 1.1; }
.stat span { font-size: 12.5px; color: var(--muted); letter-spacing: .03em; }
.desk { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.15fr); gap: 16px; align-items: start; }
@media (max-width: 860px) { .desk { grid-template-columns: minmax(0, 1fr); } }
.queue { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
.qtools { padding: 10px; border-bottom: 1px solid var(--line); display: flex; gap: 8px; flex-wrap: wrap; }
.qtools input { flex: 1 1 160px; }
.qtools select { flex: 0 1 150px; width: auto; }
.qrow { width: 100%; border: 0; border-bottom: 1px solid var(--line); background: transparent; text-align: left; padding: 12px 14px; cursor: pointer; display: grid; gap: 4px; }
.qrow:last-child { border-bottom: 0; }
.qrow:hover { background: var(--sunk); }
.qrow[aria-current="true"] { background: var(--accent-soft); }
.qrow .l1 { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.qrow .l1 strong { margin-right: auto; }
.qrow .l2 { color: var(--muted); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--bad); display: inline-block; }
.detail { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 72px); }
.kv { display: grid; grid-template-columns: 90px minmax(0, 1fr); gap: 6px 12px; font-size: 14px; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; overflow-wrap: anywhere; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.tried { margin: 0; padding-left: 20px; font-size: 14px; display: grid; gap: 2px; }
.sect { display: grid; gap: 8px; }
.sect > h4 { margin: 0; font-size: 12px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); font-weight: 600; }
.empty { padding: 28px 18px; text-align: center; color: var(--muted); display: grid; gap: 6px; }
.empty strong { color: var(--fg); font-family: var(--font-display); font-size: 17px; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(18px + env(safe-area-inset-bottom, 0px)); background: var(--fg); color: var(--bg); padding: 9px 16px; border-radius: 8px; font-size: 14px; z-index: 20; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<style>
.lang { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.lang button { border: 0; background: transparent; padding: 5px 10px; cursor: pointer; font-size: 13px; font-weight: 600; color: var(--muted); }
.lang button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.banner { background: var(--warn-soft); border-radius: var(--radius); padding: 12px 16px; display: flex; gap: 10px; align-items: flex-start; }
.banner b { color: var(--warn); }
.banner p { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; }
.qf { display: grid; gap: 10px; }
.qf-in { position: relative; }
.qf-in input { padding-left: 36px; }
.qf-in svg { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); }
.qf-res { display: grid; gap: 6px; }
.qf-res details { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 10px 14px; }
.qf-res summary { cursor: pointer; font-weight: 600; }
.qf-res summary small { display: block; color: var(--muted); font-weight: 400; font-size: 12.5px; }
.qf-res details p { margin: 8px 0 0; }
.schoolbox { border: 1px dashed var(--accent); background: var(--accent-soft); border-radius: 8px; padding: 10px 14px; display: grid; gap: 4px; font-size: 14px; }
.schoolbox a { color: var(--accent); font-weight: 600; overflow-wrap: anywhere; }
.schoolbox .tid { font-size: 15px; }
.infocard { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 10px 18px; font-size: 14px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 18px; }
.infocard div { display: grid; gap: 1px; min-width: 0; }
.infocard span { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .06em; }
.infocard b { font-weight: 500; overflow-wrap: anywhere; white-space: pre-wrap; }
.photos { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.thumb { position: relative; width: 92px; height: 92px; border-radius: 8px; overflow: hidden; border: 1px solid var(--line); background: var(--sunk); display: grid; place-items: center; font-size: 12px; color: var(--muted); text-align: center; }
.thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.thumb .x { position: absolute; top: 4px; right: 4px; width: 24px; height: 24px; border-radius: 50%; border: 0; background: var(--fg); color: var(--bg); cursor: pointer; font-size: 14px; line-height: 1; }
a.thumb { text-decoration: none; }
.addphoto { width: 92px; height: 92px; border: 1px dashed var(--line); border-radius: 8px; display: grid; place-items: center; cursor: pointer; color: var(--accent); font-weight: 600; font-size: 13px; text-align: center; padding: 6px; }
.addphoto:hover { border-color: var(--accent); background: var(--accent-soft); }
.addphoto input { position: absolute; width: 1px; height: 1px; opacity: 0; }
.rate { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.rate button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.rated { font-size: 13px; font-weight: 600; }
.rated.up { color: var(--ok); } .rated.down { color: var(--bad); }
.deskhead { display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-end; justify-content: space-between; margin-bottom: 18px; }
.settings { margin-bottom: 18px; }
</style>

<header class="bar">
  <div class="bar-in">
    <div class="brand">
      <svg width="26" height="26" viewBox="0 0 26 26" aria-hidden="true"><rect x="2" y="4" width="22" height="14" rx="2.5" fill="none" stroke="var(--accent)" stroke-width="2"/><path d="M9 22h8M13 18v4" stroke="var(--accent)" stroke-width="2" stroke-linecap="round"/><path d="M9 11.5l2.5 2.5L17 8.5" stroke="var(--ok)" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span id="brand-name">Student Tech Help Desk</span>
    </div>
    <nav class="tabs" role="tablist">
      <button class="tab" role="tab" id="tab-help" data-view="help" aria-selected="true">Get help</button>
      <button class="tab" role="tab" id="tab-mine" data-view="mine" aria-selected="false">Check a ticket</button>
      <button class="tab" role="tab" id="tab-desk" data-view="desk" aria-selected="false" hidden>Ticket queue <span class="count" id="desk-count" hidden></span></button>
    </nav>
    <div class="lang" id="lang" role="group" aria-label="Language">
      <button type="button" data-lang="en" aria-pressed="true">English</button>
      <button type="button" data-lang="es" aria-pressed="false">Español</button>
    </div>
  </div>
</header>

<main>
  <section id="view-help" class="col"></section>
  <section id="view-mine" class="col" hidden></section>
  <section id="view-desk" hidden></section>
</main>
<div class="toast" id="toast" hidden></div>

  const cur = everything.find(t => t.id === D.sel && t._uid === D.selUid);
  root.append(h("div", { class: "desk" }, queue, h("div", { class: "detail" }, cur ? detail(cur) : h("div", { class: "panel empty" }, h("strong", { text: "Pick a ticket" }), h("span", { text: "Details and the conversation with the student appear here." })))));
  if (draft && $("#desk-reply")) $("#desk-reply").value = draft;
  if (keepFocus && document.getElementById(keepFocus)) { const el = document.getElementById(keepFocus); el.focus(); if (el.setSelectionRange && el.value) try { el.setSelectionRange(el.value.length, el.value.length); } catch {} }
}

function openTicket(t) {
  D.sel = t.id; D.selUid = t._uid; D.confirm = null;
  if (t.deskUnread) writeReply(t._uid, t.id, { seenAt: new Date().toISOString() }).catch(() => {});
  renderDesk();
  if (matchMedia("(max-width: 860px)").matches) document.querySelector(".detail")?.scrollIntoView({ behavior: "smooth" });
}

function detail(t) {
  const setStatus = async s => {
    const now = new Date().toISOString();
    try { await writeReply(t._uid, t.id, { status: s, statusAt: now, seenAt: now }); toast("Marked " + STATUS[s]); }
    catch { toast("Couldn't update. Try again."); }
  };
  const copyBtn = v => h("button", { class: "btn small", onclick: e => copy(v, e.currentTarget) }, "Copy");
  return h("div", { class: "panel" },
    h("div", { class: "tcard-h" }, h("h3", { text: t.issueLabel }), pill(t.status)),
    h("div", { class: "meta" }, h("span", { class: "tid", text: t.id }), " · opened " + when(t.createdAt), t.urgent ? h("span", { class: "urgent", style: "margin-left:8px", text: "Urgent" }) : null),
    t.rating ? h("span", { class: "rated " + t.rating, text: t.rating === "up" ? "👍 Student said this helped" : "👎 Student said this didn't really help" }) : null,
    h("dl", { class: "kv" },
      h("dt", { text: "Student" }), h("dd", {}, h("span", { text: t.name }), t.lang === "es" ? h("span", { class: "pill s-self", text: "Prefers Spanish" }) : null),
      h("dt", { text: "Email" }), h("dd", {}, h("span", { text: t.email }), copyBtn(t.email)),
      h("dt", { text: "Phone" }), h("dd", {}, h("span", { text: t.phone }), copyBtn(t.phone)),
      h("dt", { text: "Device" }), h("dd", { text: t.deviceLabel }),
      t.room ? [h("dt", { text: "Location" }), h("dd", { text: t.room })] : null),
    t.details ? h("div", { class: "sect" }, h("h4", { text: "What they said" }), h("p", { style: "margin:0;white-space:pre-wrap;overflow-wrap:anywhere", text: t.details })) : null,
    t.photos?.length ? h("div", { class: "sect" }, h("h4", { text: "Photos" }), photoStrip(t), h("span", { class: "meta", text: "Click a photo to open it full size." })) : null,
    h("div", { class: "sect" }, h("h4", { text: "Already tried" }), t.tried?.length ? h("ol", { class: "tried" }, t.tried.map(x => h("li", { text: x }))) : h("span", { class: "meta", text: "Nothing yet. They skipped straight to IT." })),
    h("div", { class: "sect" }, h("h4", { text: "Status" }),
      h("div", { class: "row" }, ["new", "progress", "waiting", "resolved"].map(s => h("button", { class: "btn small" + (t.status === s ? " primary" : ""), onclick: () => setStatus(s), disabled: t.status === s }, STATUS[s])))),
    h("div", { class: "sect" }, h("h4", { text: "Conversation" }), (() => { const L = lang; lang = "en"; const th = thread(t, "it"); lang = L; return th; })(),
      replyBox("desk-reply", "Reply to " + (t.name.split(" ")[0] || "student") + "…", "Send", async text => {
        const now = new Date().toISOString();
        await writeReply(t._uid, t.id, { messages: { [now.replace(/\D/g, "") + rid(3)]: { text, at: now } }, seenAt: now, ...(t.status === "new" ? { status: "progress", statusAt: now } : {}) });
        toast("Reply sent");
      }, "Message didn't send. Try again."),
      h("span", { class: "meta", text: "Students see replies when they look up this ticket number on the student page. For anything urgent, call or text them." })),
    h("div", { class: "sect" }, h("h4", { text: "Copy for your records" }), h("div", { class: "row" }, h("button", { class: "btn small", onclick: e => copy(ticketText(t), e.currentTarget) }, "Copy ticket summary"))),
    cleanup(t));
}

// Spam and vandalism tools: delete a ticket, delete everything from one account, or block an account.
function cleanup(t) {
  const isBlocked = !!blocked[t._uid];
  const confirmRow = (key, text, action) => D.confirm === key
    ? h("div", { class: "notice warn" }, h("span", { text }), h("div", { class: "row" },
        h("button", { class: "btn small", onclick: () => { D.confirm = null; renderDesk(); } }, "Cancel"),
        h("button", { class: "btn small primary", onclick: async () => { D.confirm = null; try { await action(); } catch { toast("Couldn't do that. Try again."); } renderDesk(); } }, "Yes, do it")))
    : null;
  const ask = key => () => { D.confirm = key; renderDesk(); };
  const count = allTickets().filter(x => x._uid === t._uid).length;
  return h("div", { class: "sect" }, h("h4", { text: "Spam & cleanup" }),
    h("div", { class: "row" },
      h("button", { class: "btn small", onclick: ask("del") }, "Delete this ticket"),
      h("button", { class: "btn small", onclick: ask("block") }, isBlocked ? "Unblock this account" : "Block this account"),
      h("button", { class: "btn small", onclick: ask("wipe") }, `Delete all ${count} from this account`)),
    confirmRow("del", `Delete ticket ${t.id} for good?`, async () => {
      await removeEntry("tickets/" + t._uid, t.id); await removeEntry("replies/" + t._uid, t.id); D.sel = null; toast("Ticket deleted");
    }),
    confirmRow("block", isBlocked ? "Let this account send tickets again?" : "Block this account? Its tickets disappear from your queue (see “Blocked accounts” in the filter), and it can't send new ones.", async () => {
      const ref = db.doc("config/blocked"), snap = await ref.get();
      const uids = { ...(snap.exists && snap.data()?.uids && typeof snap.data().uids === "object" ? snap.data().uids : {}) };
      if (isBlocked) delete uids[t._uid]; else uids[t._uid] = { at: new Date().toISOString(), name: t.name };
      await ref.set({ uids }); toast(isBlocked ? "Account unblocked" : "Account blocked");
    }),
    confirmRow("wipe", `Delete all ${count} tickets from this account for good?`, async () => {
      await db.doc("tickets/" + t._uid).delete(); await db.doc("replies/" + t._uid).delete(); D.sel = null; toast("Deleted");
    }),
    h("span", { class: "meta", text: "Blocking works per signed-in account. Students can only ever change their own tickets, never yours or anyone else's." }));
}

// Two pages from one ticket store: the artifact link is the student page, the same link ending in #desk is the IT queue.
function applyMode() {
  const desk = location.hash === "#desk";
  $("#brand-name").textContent = desk ? "IT Ticket Desk" : "Student Tech Help Desk";
  document.title = desk ? "IT Ticket Desk" : "Student Tech Help Desk";
  $("#tab-help").hidden = $("#tab-mine").hidden = $("#lang").hidden = desk;
  $("#tab-desk").hidden = !desk;
  if (desk) { const L = lang; lang = "en"; document.documentElement.lang = "en"; show("desk"); lang = L; }
  else { document.documentElement.lang = lang; show(current === "desk" ? "help" : current); }
}
addEventListener("hashchange", applyMode);
setLang(lang);
applyMode();
setInterval(() => { if (current === "desk" && !document.activeElement?.matches("textarea, input")) renderDesk(); }, 60000);
})();
</script>
